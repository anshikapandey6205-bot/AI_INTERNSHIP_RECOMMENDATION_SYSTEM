<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% block title %}MATCH//AI{% endblock %}
    </title>

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >

</head>


<body>

    <div class="noise"></div>
     <div class="cursor-glow"></div>

    <header class="topbar">

        <a
            href="{{ url_for('index') }}"
            class="logo"
        >
            <span class="logo-mark">M</span>
            MATCH<span>//</span>AI
        </a>


        <div class="system-status">

            <span class="status-dot"></span>

            SYSTEM ONLINE

        </div>


        <nav>

            <a href="{{ url_for('index') }}">
                HOME
            </a>

            <a href="{{ url_for('internships') }}">
                OPPORTUNITIES
            </a>

            <a href="{{ url_for('profile') }}">
                BUILD PROFILE
            </a>

        </nav>

    </header>


    <main>

        {% block content %}

        {% endblock %}

    </main>


    <footer class="footer">

        <div>
            MATCH//AI
        </div>

        <div>
            AI-POWERED CAREER DISCOVERY
        </div>

        <div>
            SIH 2026
        </div>

    </footer>


    <script
        src="{{ url_for('static', filename='js/app.js') }}"
    ></script>

</body>

</html>
